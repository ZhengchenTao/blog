baseURL: "https://blog.zhengchentao.win/"
title: "陶政辰的笔记"
theme: stack

defaultContentLanguage: zh
hasCJKLanguage: true
languageCode: zh-cn

pagination:
  pagerSize: 5

permalinks:
  posts: "/posts/:slug/"
  page: "/:slug/"

services:
  disqus:
    shortname: ""

params:
  mainSections: ["posts"]
  rssFullContent: true
  favicon: "/favicon.svg"

  footer:
    since: 2026
    customText: ""

  dateFormat:
    published: "2006-01-02"
    lastUpdated: "2006-01-02 15:04"

  sidebar:
    compact: false
    emoji: ""
    subtitle: "C# / .NET 工程师，住在上海。这里写技术、网络、AI 和一些日常折腾。"
    avatar: "img/avatar.jpg"

  article:
    math: true
    toc: true
    readingTime: true
    license:
      enabled: true
      default: "本文按 [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/deed.zh) 协议发布"

  comments:
    enabled: false
    provider: disqus

  widgets:
    homepage:
      - type: search
      - type: archives
        params:
          limit: 5
      - type: categories
        params:
          limit: 10
      - type: tag-cloud
        params:
          limit: 10
    page:
      - type: toc

  opengraph:
    twitter:
      site: ""
      card: summary_large_image

  defaultImage:
    opengraph:
      enabled: false
      local: false
      src: ""

  colorScheme:
    toggle: true
    default: auto

  imageProcessing:
    cover:
      enabled: true
    content:
      enabled: true

menu:
  main:
    - identifier: home
      name: 首页
      url: /
      weight: -100
      params:
        icon: home
    - identifier: archives
      name: 归档
      url: /archives/
      weight: -90
      params:
        icon: archives
    - identifier: resume
      name: 简历
      url: /resume/
      weight: -80
      params:
        icon: file-text
    - identifier: about
      name: 关于
      url: /about/
      weight: -70
      params:
        icon: user
  social:
    - identifier: github
      name: GitHub
      url: "https://github.com/zhengchentao"
      params:
        icon: brand-github
    - identifier: rss
      name: RSS
      url: "/index.xml"
      params:
        icon: rss

related:
  includeNewer: true
  threshold: 60
  toLower: false
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 200

markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [["\\[", "\\]"], ["$$", "$$"]]
          inline: [["\\(", "\\)"]]
    renderer:
      unsafe: true
  tableOfContents:
    endLevel: 4
    ordered: false
    startLevel: 2
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNoStart: 1
    lineNos: false
    lineNumbersInTable: true
    tabWidth: 4
