# blog nginx 配置（替换 nginx:alpine 镜像默认 default.conf）
# 缓存分层（CF Cache Rule 对 blog 是 respect_origin，这里的头就是边缘 TTL 事实源）：
#   1. Hugo fingerprint 资源（sha256 hex64 命名，内容变则名变）→ 一年 immutable
#   2. 其余静态资源 → 2h（对齐迁移前 CF 默认扩展名缓存行为）
#   3. HTML / 无扩展路径 → no-cache（CF 不缓存，发布即生效，杜绝新文章陈旧）
# 2026-07-18 加，见 vault NAS 完成日志。
server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    add_header Cache-Control "no-cache";

    location ~* "\.[0-9a-f]{64}\.(css|js)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* "\.(js|css|png|jpe?g|gif|svg|webp|ico|woff2?|ttf|xml|txt|json)$" {
        add_header Cache-Control "public, max-age=7200";
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
